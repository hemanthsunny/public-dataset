[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# --- Caching -----------------------------------------------------------
# Static build assets are content-hashed by Next.js, so they can be cached
# forever. HTML/API responses are left to Next.js's own cache-control
# headers (see next.config.mjs) so ISR/revalidation keeps working.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# --- Security headers ----------------------------------------------------
# Duplicated (defence-in-depth) from next.config.mjs so they apply even to
# anything Netlify serves directly (e.g. a cache hit) without invoking the
# Next.js server.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

# --- Redirects -------------------------------------------------------------
[[redirects]]
  from = "/healthz"
  to = "/api/health"
  status = 200

[context.deploy-preview.environment]
  NEXT_PUBLIC_SITE_URL = "$DEPLOY_PRIME_URL"

[context.branch-deploy.environment]
  NEXT_PUBLIC_SITE_URL = "$DEPLOY_PRIME_URL"
